name: CI and delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: PR and commit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check PR title, commit titles, and whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          subject = re.compile(
              r"(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)"
              r"(?:\([a-zA-Z0-9._/-]+\))?!?: \S.*"
          )
          event = os.environ
          commit_range = f"{event['BASE_SHA']}..{event['HEAD_SHA']}"
          errors = []
          if not subject.fullmatch(event["PR_TITLE"]):
              errors.append("Use a Conventional Commit PR title, e.g. ci: add build checks.")

          commits = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%h%x09%s", commit_range],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          for line in commits.split("\n"):
              if not line:
                  continue
              sha, title = line.split("\t", 1)
              if not subject.fullmatch(title):
                  errors.append(f"Commit {sha} needs a Conventional Commit title.")

          if errors:
              raise SystemExit("\n".join(errors))
          PY
          # Preserve checks for trailing spaces while accepting CRLF line endings.
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol \
            diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Lint workflow syntax
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz' | sha256sum --check
          tar -xzf actionlint.tgz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color

  secret-scan:
    name: Secret exposure scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz' | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan checked-out files and commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Use upstream rules so repository config cannot suppress findings.
          config="$RUNNER_TEMP/gitleaks.toml"
          printf '[extend]\nuseDefault = true\n' > "$config"
          scanner="$RUNNER_TEMP/gitleaks"
          flags=(--config "$config" --gitleaks-ignore-path "$RUNNER_TEMP" --ignore-gitleaks-allow --redact=100 --no-banner)
          result=0
          "$scanner" dir "${flags[@]}" . || result=1
          history="$HEAD_SHA"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            history="$BASE_SHA..$HEAD_SHA"
          fi
          "$scanner" git "${flags[@]}" --log-opts="$history" . || result=1
          exit "$result"

  project-checks:
    name: Validate n8n export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [repository-checks, secret-scan]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Validate workflow graph and credential references
        env:
          EXPORT_FILE: "Email Assistant Agent.json"
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workflow = json.loads(Path(os.environ["EXPORT_FILE"]).read_text(encoding="utf-8"))
          nodes = workflow["nodes"]
          connections = workflow["connections"]
          if not isinstance(nodes, list) or not nodes or not isinstance(connections, dict):
              raise SystemExit("Expected a nonempty node list and a connections object.")
          if workflow.get("pinData"):
              raise SystemExit("Remove pinned execution data before publishing the export.")

          names = set()
          ids = set()
          for node in nodes:
              for field in ("name", "id", "type"):
                  if not isinstance(node.get(field), str) or not node[field].strip():
                      raise SystemExit(f"An n8n node is missing a valid {field}.")
              if node["name"] in names or node["id"] in ids:
                  raise SystemExit("Node names and IDs must be unique.")
              names.add(node["name"])
              ids.add(node["id"])

              for reference in node.get("credentials", {}).values():
                  if not isinstance(reference, dict) or not reference.keys() <= {"id", "name"}:
                      raise SystemExit("Export credential references only, without credential data.")

          for source, channels in connections.items():
              if source not in names:
                  raise SystemExit("A connection starts at an unknown node.")
              for outputs in channels.values():
                  for output in outputs:
                      for target in output or []:
                          if target["node"] not in names:
                              raise SystemExit("A connection leads to an unknown node.")
                          if not isinstance(target["index"], int) or target["index"] < 0:
                              raise SystemExit("A connection has an invalid input index.")
          PY
      - name: Deliver validated artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch &&
          needs.repository-checks.result == 'success' &&
          needs.secret-scan.result == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: email-assistant-n8n-export
          retention-days: 14
          if-no-files-found: error
          path: |
            Email Assistant Agent.json
